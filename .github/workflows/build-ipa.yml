name: Build iOS IPA (sin firmar)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compilar
        run: |
          chmod +x build.sh package-ipa.sh
          ./build.sh

      - name: Empaquetar IPA
        run: ./package-ipa.sh

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Polytes-ipa
          path: build/Polytes.ipa

      - name: Publicar en release app-v5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view app-v5 >/dev/null 2>&1 || gh release create app-v5 --title "Polytes v5" --notes "Polytes para iPhone: mascota de escritorio con física (recreación propia para iOS del diseño de Polytes). v5: correcciones de la grabación del usuario — el cuerpo caído ya no se hace un nudo (contactos por punto con fricción, anti-pliegue y reposo estabilizado; se tiende y se levanta), nadie queda tapado por la barra inferior (sombra de contacto y colinas más claras), el creador ya no dibuja textos fantasma al hacer scroll (tarjetas sólidas y escritorio en pausa), la ventana Música ya muestra su carátula, disco y progreso (contenido adaptativo), un cuerpo colgado de una ventana que se mueve ya no se estira (colisiones por punto y arrastre por fricción: si la ventana va rápido, se escurre y cae) y ya no hay puñetazos con chispas al aire (los ataques exigen un dedo activo o un rival a distancia). Mejoras generales: lanzamiento repartido por todo el cuerpo, caché de intervalos visibles por paso (rendimiento), IA que respira entre conductas, borde definido en las ventanas y pose tumbada con volumen. IPA sin firmar: instalar con SideStore o AltStore."
          gh release upload app-v5 build/Polytes.ipa --clobber

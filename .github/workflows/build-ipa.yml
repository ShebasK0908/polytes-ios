name: Build iOS IPA (sin firmar)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compilar
        run: |
          chmod +x build.sh package-ipa.sh
          ./build.sh

      - name: Empaquetar IPA
        run: ./package-ipa.sh

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Polytes-ipa
          path: build/Polytes.ipa

      - name: Publicar en release app-v6
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view app-v6 >/dev/null 2>&1 || gh release create app-v6 --title "Polytes v6" --notes "Polytes para iPhone: mascota de escritorio con física (recreación propia para iOS del diseño de Polytes). v6: auditoría completa del proyecto. El láser ya no atraviesa las ventanas (el haz se corta en la primera que se interponga y, si hay una en medio, el rival no recibe el golpe); las bolas de fuego ya no estallan al nacer cuando se dispara delante de una ventana (solo al entrar en ella); ya no se puede agarrar a un stickman que otro lleva en alto; la represalia contra el dedo se levanta primero si estaba sentado o tumbado (antes el estado quedaba a medias); mirar el cursor exige un dedo activo (nada de perseguir recuerdos de dedos); agarrar cancela el dash en curso (no se reanuda al soltar); al eliminar un stickman se limpian también las referencias de la mente de los demás; y salvaguarda por si el mundo se creara en vertical antes de girar el teléfono. La lista «En escena» del creador ahora muestra la sociabilidad y el humor de cada stickman. IPA sin firmar: instalar con SideStore o AltStore."
          gh release upload app-v6 build/Polytes.ipa --clobber

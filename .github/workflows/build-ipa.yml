name: Build iOS IPA (sin firmar)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compilar
        run: |
          chmod +x build.sh package-ipa.sh
          ./build.sh

      - name: Empaquetar IPA
        run: ./package-ipa.sh

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Polytes-ipa
          path: build/Polytes.ipa

      - name: Publicar en release app-v3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view app-v3 >/dev/null 2>&1 || gh release create app-v3 --title "Polytes v3" --notes "Polytes para iPhone: mascota de escritorio con física (recreación propia para iOS del diseño de Polytes). v3: poderes (volar con chorros de llama, fuego, láser, superpuñetazo, superfuerza, supervelocidad), inteligencia de ataque (represalia contra el dedo y peleas entre stickmen con bloqueos y esquivas), agarre 1:1 tipo cursor, cabecera fuera del mundo y colisiones por punto. IPA sin firmar: instalar con SideStore o AltStore."
          gh release upload app-v3 build/Polytes.ipa --clobber

name: Build iOS IPA (sin firmar)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compilar
        run: |
          chmod +x build.sh package-ipa.sh
          ./build.sh

      - name: Empaquetar IPA
        run: ./package-ipa.sh

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Polytes-ipa
          path: build/Polytes.ipa

      - name: Publicar en release app-v4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view app-v4 >/dev/null 2>&1 || gh release create app-v4 --title "Polytes v4" --notes "Polytes para iPhone: mascota de escritorio con física (recreación propia para iOS del diseño de Polytes). v4: pantalla completa de verdad (sin cabecera ni barra de estado, botón flotante), cursor visible (flecha estilo PC y mano al agarrar) y una mente mucho más completa: percepción del cursor y de los demás, memoria (quién le pegó, su sitio, zonas visitadas), humor (contento, curioso, aburrido, irritado, asustado) y conductas nuevas (explorar, sentarse en el borde de una ventana con las piernas colgando, tumbarse a descansar, seguir a otro, ayudar a levantarse a un caído, asomarse al borde, saludar, reaccionar al cursor). Además: correcciones de la revisión (el cargado ya no queda pegado al acabar una pelea, las bolas de fuego chocan con las ventanas), icono de app, escritorio con cielo, sol y colinas, ventanas con contenido propio y personajes conocidos en el creador (The Second Coming, The Dark Lord, Víctima). IPA sin firmar: instalar con SideStore o AltStore."
          gh release upload app-v4 build/Polytes.ipa --clobber
